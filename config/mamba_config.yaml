model:
  type: "MambaController"
  num_classes: 8
  d_model: 256
  n_layers: 6
  d_state: 16
  d_conv: 4
  expand: 2
  dropout: 0.1
  sequence_length: 100

training:
  batch_size: 64
  epochs: 30
  learning_rate: 0.0005
  optimizer: "AdamW"
  weight_decay: 0.01
  loss_function:
    type: "FocalLoss"
    gamma: 2
  early_stopping:
    patience: 10
    monitor: "val_f1"
  grad_clip: 1.0
  lr_scheduler:
    type: "CosineAnnealing"
    eta_min: 0.000001

ambiguous_samples:
  confidence_threshold: 0.3
  source_dataset: "validation"
  cnn_model_path: "models/cnn_best.pt"

hardware:
  device: "cuda"
  mixed_precision: true
