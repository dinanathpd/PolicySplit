model:
  type: "DataPlaneCNN"
  num_classes: 8
  sequence_length: 100

training:
  batch_size: 128
  epochs: 50
  learning_rate: 0.001
  optimizer: "Adam"
  lr_scheduler:
    type: "ReduceLROnPlateau"
    factor: 0.5
    patience: 5
  early_stopping:
    patience: 10
    monitor: "val_f1"
  grad_clip: 1.0
  weight_init: "he_normal"

data:
  dataset_dir: "dataset_cic_iot_2023/CSV/MERGED_CSV"
  train_path: "data/train.npz"
  val_path: "data/val.npz"
  test_path: "data/test.npz"
  class_weights_path: "data/class_weights.npy"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

quantization:
  method: "dynamic"
  dtype: "qint8"
  max_accuracy_drop: 0.02
  output_path: "models/quantized/cnn_int8.pth"
  weights_csv: "p4/weights/cnn_weights.csv"
